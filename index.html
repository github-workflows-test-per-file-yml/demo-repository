<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitHub Actions workflow demonstration repository.">
  <title>Workflow Demo</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2c2c2b;
      background: #f9f8f7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 720px);
      padding: clamp(32px, 7vw, 64px);
      background: #fff;
      border: 1px solid #e6e5e3;
      border-radius: 12px;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #2783de;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }
    p {
      max-width: 58ch;
      margin: 0;
      color: #7d7a75;
      font-size: 18px;
      line-height: 1.6;
    }
    @media (prefers-color-scheme: dark) {
      :root { color: #fff; background: #191919; }
      main { background: #202020; border-color: rgba(255,255,255,.2); }
      .eyebrow { color: #5e9fe8; }
      p { color: rgba(255,255,255,.65); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub Actions</p>
    <h1>Workflow demo</h1>
    <p>This repository demonstrates a small, secure CI workflow with automated HTML validation and dependency updates.</p>
  </main>
</body>
</html>
