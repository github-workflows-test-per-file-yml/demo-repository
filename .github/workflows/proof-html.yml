name: Proof HTML

on:
  push:
    paths:
      - '**/*.html'
      - '.github/scripts/check_html.py'
      - '.github/workflows/proof-html.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '.github/scripts/check_html.py'
      - '.github/workflows/proof-html.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-html-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate HTML structure
        run: python3 .github/scripts/check_html.py
