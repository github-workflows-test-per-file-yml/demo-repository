name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions: {}

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign issue or pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: Mikhai56
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "${ISSUE_NUMBER:-}" ]]; then
            gh issue edit "$ISSUE_NUMBER" --add-assignee "$ASSIGNEE" --repo "$GITHUB_REPOSITORY"
          else
            gh pr edit "$PR_NUMBER" --add-assignee "$ASSIGNEE" --repo "$GITHUB_REPOSITORY"
          fi
